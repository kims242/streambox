name: Build, Scan and Push

on:
  push:
    branches: [ "main" ]
    

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupération du code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Important pour que SonarQube puisse analyser l'historique Git

      # 2. Scan de Code et de Sécurité avec SonarQube
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        # Si le scan échoue (Quality Gate non respectée), on peut vouloir bloquer le pipeline ici
        # Pour l'instant, on laisse passer pour apprendre.

      # 3. Connexion au registre Docker (Méthode via secrets classiques)
      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_USERNAME }}.azurecr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 4. Construction et Push de l'image (seulement si le scan est passé)
      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./app/backend
          push: true
          tags: ${{ secrets.REGISTRY_USERNAME }}.azurecr.io/backend:v1